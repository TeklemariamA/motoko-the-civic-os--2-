server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Enable Gzip compression for faster page load and improved Core Web Vitals / SEO
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

  # Security and indexing hygiene headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # ACME / Let's Encrypt challenge validation (never route to SPA fallback)
  location ^~ /.well-known/acme-challenge/ {
    default_type "text/plain";
    try_files $uri =404;
  }

  # Search engine crawlers: robots.txt and sitemap.xml
  location = /robots.txt {
    add_header Content-Type "text/plain; charset=utf-8" always;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  location = /sitemap.xml {
    add_header Content-Type "application/xml; charset=utf-8" always;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # Never cache the SPA entry document so new deployments are picked up immediately.
  location = /index.html {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  location = /runtime-config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  # Cache images and web assets
  location ~* \.(?:ico|png|svg|webp|jpg|jpeg|gif)$ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # Cache static assets aggressively; Vite emits content-hashed filenames.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
